# Configured watchlist. `ticker` is required; `cik` is optional (resolved from
# the SEC ticker map when omitted); `name` is informational.
#
# Used by:
#   - `sec collect-filings` when no --ticker is supplied (iterates this list)
#   - `sec collect-ipos` as the default universe to scan for S-1/F-1 filings

companies:
  - ticker: NVDA
    name: "NVIDIA Corporation"        # semiconductors
  - ticker: MSFT
    name: "Microsoft Corporation"     # cloud/software
  - ticker: AMZN
    name: "Amazon.com, Inc."          # cloud/consumer
  - ticker: GOOGL
    name: "Alphabet Inc."             # ads/cloud
  - ticker: META
    name: "Meta Platforms, Inc."      # ads/AI
  - ticker: AAPL
    name: "Apple Inc."                # hardware/services
  - ticker: JPM
    name: "JPMorgan Chase & Co."      # banking
  - ticker: XOM
    name: "Exxon Mobil Corporation"   # energy
    # Pinned: SEC's company_tickers.json currently maps XOM to CIK 0002115436
    # ("ExxonMobil Holdings Corp"), which has no periodic reports. The operating
    # company that actually files 10-K/10-Q is CIK 0000034088.
    cik: "0000034088"
  - ticker: WMT
    name: "Walmart Inc."              # retail
  - ticker: UNH
    name: "UnitedHealth Group Incorporated"  # healthcare
  - ticker: CAT
    name: "Caterpillar Inc."          # industrials
  - ticker: NEE
    name: "NextEra Energy, Inc."      # utilities
  - ticker: PG
    name: "Procter & Gamble Company"  # consumer staples
  - ticker: PFE
    name: "Pfizer Inc."               # pharmaceuticals
  - ticker: UNP
    name: "Union Pacific Corporation" # transportation / rail
