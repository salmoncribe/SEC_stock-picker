# Supported SEC filing form types.
#
# `supported` is the allow-list used by validation: a filing whose form is not
# in this list is flagged (status=warning, reason=unsupported_form) rather than
# stored blindly. Extend this list as new form types become relevant.
#
# `ipo` is the subset treated as IPO / registration filings for `collect-ipos`.

supported:
  - "10-K"      # Annual report
  - "10-K/A"
  - "10-Q"      # Quarterly report
  - "10-Q/A"
  - "8-K"       # Material event
  - "8-K/A"
  - "S-1"       # Registration statement (IPO)
  - "S-1/A"     # Amended S-1
  - "F-1"       # Registration statement (foreign private issuer)
  - "F-1/A"     # Amended F-1
  - "424B4"     # Prospectus (often the priced IPO)
  - "DEF 14A"   # Proxy statement

ipo:
  - "S-1"
  - "S-1/A"
  - "F-1"
  - "F-1/A"
