# Economic series to collect from FRED (https://fred.stlouisfed.org).
# `id` is the FRED series id; `alias` is a human label used in logs/output.
# Add/remove entries freely — the collector iterates this list.

series:
  - id: DFF
    alias: federal_funds_rate
    note: "Effective Federal Funds Rate"

  - id: DGS10
    alias: treasury_10y
    note: "10-Year Treasury Constant Maturity Rate"

  - id: DGS2
    alias: treasury_2y
    note: "2-Year Treasury Constant Maturity Rate"

  - id: CPIAUCSL
    alias: cpi
    note: "Consumer Price Index for All Urban Consumers: All Items"

  - id: UNRATE
    alias: unemployment_rate
    note: "Unemployment Rate"

  - id: INDPRO
    alias: industrial_production
    note: "Industrial Production: Total Index"

# Default observation window. Leave blank for full history.
# Dates are ISO (YYYY-MM-DD).
defaults:
  observation_start: "2015-01-01"
  observation_end: ""
