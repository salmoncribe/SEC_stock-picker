[project]
name = "market-intelligence"
version = "0.1.0"
description = "Local market-intelligence data platform: durable ingestion of free financial & economic data (SEC EDGAR, FRED) into DuckDB + Parquet."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Market Intelligence" }]
keywords = ["sec", "edgar", "fred", "duckdb", "parquet", "market-data"]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pytz>=2024.1",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "yfinance>=0.2.40",
    # Portfolio construction. numpy was already present transitively (pandas,
    # pyarrow); it is declared here because portfolio/ uses it as a first-class
    # domain type -- the price panel is a numpy array, not a DataFrame.
    "numpy>=2.5",
    "scipy>=1.18",
    # cvxpy is the optimizer engine. PyPortfolioOpt is used ONLY for
    # BlackLittermanModel + Idzorek behind the bl_engine flag; a hand-rolled
    # numpy BL is the tested fallback, so pypfopt never sits in the solve path.
    "cvxpy>=1.9",
    "pyportfolioopt>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
market-intelligence = "market_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# Dev tooling lives in the optional "dev" extra above; install with:
#   uv sync --extra dev

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008", # function calls in argument defaults (Typer uses this idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["market_intelligence"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
packages = ["market_intelligence"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
# yfinance ships no py.typed marker or stubs; it is confined to one module
# (clients/market_yfinance.py) behind the MarketDataProvider interface.
# scipy likewise ships no py.typed. It has exactly one importer
# (portfolio/metrics.py) using two functions, the normal CDF and its inverse.
# If scipy-stubs is ever added to the dev extra, drop scipy.* from this list in
# the same change -- warn_unused_ignores would otherwise start failing.
module = ["duckdb.*", "pyarrow.*", "yfinance.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:market_intelligence.*"]
